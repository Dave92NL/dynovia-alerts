name: scrape

on:
  schedule:
    # Hourly, because that is roughly the best GitHub will honour anyway - a
    # */10 schedule measured out at two runs in eleven hours. The ten-minute
    # tick lives inside the job now; this only has to start one.
    - cron: "0 * * * *"
  workflow_dispatch:

# The database is committed back to the repo, so two runs must never overlap.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: scrape on a ten-minute tick for the next hour
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          git config user.name "dynovia-bot"
          git config user.email "actions@users.noreply.github.com"
          # The job keeps its own clock. A schedule event only has to arrive
          # once an hour for the ten-minute tick to hold, which matters because
          # a goal notified four hours late is not a notification. Which
          # sources actually get fetched is still poll_interval's call, so this
          # does not mean 144 hits a day on a village club's website.
          for tick in $(seq 6); do
            python -m dynovia.run
            git add -A data web/data
            if git diff --cached --quiet; then
              echo "tik $tick: nic się nie zmieniło"
            else
              git commit -m "dane: $(date -u '+%Y-%m-%d %H:%M') UTC"
              # Another run may have pushed while this one was scraping.
              git pull --rebase --autostash
              git push
            fi
            # Not `[ ... ] && sleep`: on the last tick that tests false, and
            # under `set -e` a false test ends the job as a failure.
            if [ "$tick" -lt 6 ]; then sleep 600; fi
          done

      - name: tell me if the run broke
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=❌ Workflow scrape padł: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
