name: scrape

on:
  schedule:
    # Every 10 minutes. GitHub runs scheduled workflows late under load, often
    # by 5-15 minutes, which is why reminders in differ.py are thresholds
    # rather than windows.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# The database is committed back to the repo, so two runs must never overlap.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: scrape, notify, answer commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: python -m dynovia.run

      - name: commit the data if it moved
        run: |
          git config user.name "dynovia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data web/data
          if git diff --cached --quiet; then
            echo "nic się nie zmieniło"
          else
            git commit -m "dane: $(date -u '+%Y-%m-%d %H:%M') UTC"
            # Another run may have pushed while this one was scraping.
            git pull --rebase --autostash
            git push
          fi

      - name: tell me if the run broke
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=❌ Workflow scrape padł: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
