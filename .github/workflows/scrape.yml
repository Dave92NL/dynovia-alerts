name: scrape

on:
  schedule:
    # Asking hourly and measuring what arrives: over thirty hours the gaps ran
    # 2h15 to 6h15, averaging four hours, and asking every ten minutes had got
    # the same. What GitHub honours does not depend on what we request, so this
    # only has to wake the job up; the job does its own ticking.
    - cron: "0 * * * *"
  workflow_dispatch:

# The database is committed back to the repo, so two runs must never overlap.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: scrape on a ten-minute tick for the next five hours
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          git config user.name "dynovia-bot"
          git config user.email "actions@users.noreply.github.com"

          # A SQLite file cannot be merged. When two runs both write one -
          # after a cancel, a timeout, a retried job - a rebase stops dead on a
          # binary conflict and takes the whole job down with it. So nobody
          # merges: whoever pushed first wins and the late one throws its own
          # work away.
          #
          # Nothing is lost by that. The scrape repeats on the next tick,
          # protokoly/ re-imports, and a protocol that arrived over Telegram
          # rolls back together with the offset that would have marked it read,
          # because the two live in the same file - so Telegram hands it over
          # again.
          take_origin() {
            git rebase --abort 2>/dev/null || true
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
          }
          # The job keeps its own clock for five hours, which is longer than
          # the gap between starts GitHub actually gives us. The next start
          # therefore tends to arrive while this one is still ticking, and
          # concurrency queues it to begin the moment this ends - so the runs
          # chain instead of leaving four hours of silence between them.
          #
          # A deadline rather than a fixed count: tick duration varies with the
          # network, and a count that overruns timeout-minutes would end the
          # job as a failure and send a "workflow padł" that is not true.
          #
          # Which sources actually get fetched is still poll_interval's call,
          # so this is not 30 hits a day on a village club's website.
          deadline=$(( $(date +%s) + 300 * 60 ))
          tick=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            tick=$(( tick + 1 ))
            # Pick up anything pushed since this job started. Without it a fix
            # waits for the loop to end, which is up to five hours, and the
            # only reason it ever arrived sooner was the pull below happening
            # to run whenever the data moved.
            # Nothing of ours is uncommitted here - the previous tick either
            # pushed or reset - so this is a fast-forward or it is a mess, and
            # a mess is resolved the same way as everything else.
            git pull --rebase --autostash --quiet || take_origin
            python -m dynovia.run
            git add -A data web/data
            if git diff --cached --quiet; then
              echo "tik $tick: nic się nie zmieniło"
            else
              git commit -m "dane: $(date -u '+%Y-%m-%d %H:%M') UTC"
              # Another run may have pushed while this one was scraping, and
              # the push can still lose a race after a clean pull.
              if git pull --rebase --autostash && git push --quiet; then
                echo "tik $tick: dane wypchniete"
              else
                take_origin
                echo "tik $tick: ktos byl szybszy - biore jego stan, licze od nowa"
              fi
            fi
            # Listening, not sleeping: this returns the second a protocol
            # or a command is sent, so the phone does not wait out a tick it
            # has no reason to wait for.
            python -m dynovia.wait 600
          done
          echo "$tick tikow w tym przebiegu"

      - name: tell me if the run broke
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=❌ Workflow scrape padł: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
