[project]
name = "dynovia-alerts"
version = "0.1.0"
description = "Private match notifier for Dynovia Dynow"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    # Windows ships no tz database, so zoneinfo("Europe/Warsaw") needs this.
    "tzdata",
    "pywebpush",
]

[project.optional-dependencies]
# pyyaml: test_workflow_git.py czyta funkcje gitowe wprost z scrape.yml, zeby
# mierzyc workflow, a nie jego kopie. Przez to testy maja wlasna zaleznosc,
# ktorej sam program nie ma - niezadeklarowana przechodzila tylko tam, gdzie
# ktos mial pyyaml z innego powodu.
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The system temp directory is not writable here, so tmp_path lives in-project.
addopts = "--basetemp=.pytest-tmp"
