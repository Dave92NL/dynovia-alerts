[project]
name = "dynovia-alerts"
version = "0.1.0"
description = "Private match notifier for Dynovia Dynow"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    # Windows ships no tz database, so zoneinfo("Europe/Warsaw") needs this.
    "tzdata",
    "pywebpush",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The system temp directory is not writable here, so tmp_path lives in-project.
addopts = "--basetemp=.pytest-tmp"
