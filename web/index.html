<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynovia Alerts</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#004B96">
<style>
  /* Klubowe kolory odczytane wprost z herbu. */
  :root {
    --blue: #004B96;
    --blue-dark: #002f61;
    --gold: #FFC801;
    --ink: #122238;
    --muted: #60718a;
    --line: #e3e9f0;
    --bg: #f3f6fa;
    --card: #ffffff;
    --success: #137353;
    /* Strzałki zmian w kolorach samego protokołu PZPN - _icon_kind()
       w protokol.py rozpoznaje wejście i zejście wyłącznie po tych
       dwóch wartościach fill. */
    --off: #F26C36;
    --on: #8BF236;
    --on-ink: #3f7a00;
    --yellow: #F5C518;
    --red: #D83A2E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #eaf1f8 0, var(--bg) 310px);
    color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(82px + env(safe-area-inset-bottom));
  }
  .app-shell { max-width: 640px; margin: 0 auto; }
  header {
    background: linear-gradient(135deg, var(--blue-dark), var(--blue));
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 16px) 20px 28px;
    display: flex; align-items: center; gap: 12px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 8px 20px rgba(0, 57, 117, .18);
  }
  header img { width: 46px; height: 46px; border-radius: 13px; background: #fff; padding: 2px; box-shadow: 0 3px 10px rgba(0,0,0,.16); }
  header h1 { font-size: 19px; margin: 0; font-weight: 750; letter-spacing: -.25px; }
  header p { margin: 1px 0 0; font-size: 12px; opacity: .78; }
  nav {
    position: fixed; z-index: 10; bottom: 0; left: 0; right: 0;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
    background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
    padding: 7px max(12px, env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    border-top: 1px solid rgba(18,34,56,.1); box-shadow: 0 -8px 24px rgba(18,34,56,.08);
  }
  nav button {
    position: relative; background: none; border: 0; color: var(--muted);
    font: inherit; font-size: 10px; font-weight: 650; padding: 7px 2px 6px; cursor: pointer;
  }
  nav button::before { display: block; font-size: 18px; line-height: 1.1; margin-bottom: 3px; }
  nav button[data-tab="next"]::before { content: "⚽"; }
  nav button[data-tab="results"]::before { content: "✓"; }
  nav button[data-tab="stats"]::before { content: "▥"; }
  nav button[data-tab="table"]::before { content: "♜"; }
  nav button[data-tab="sources"]::before { content: "•••"; letter-spacing: 1px; }
  nav button[aria-current="true"] { color: var(--blue); }
  nav button[aria-current="true"]::after { content: ""; position: absolute; top: 0; left: 50%; width: 20px; height: 3px; transform: translateX(-50%); border-radius: 2px; background: var(--gold); }
  main { padding: 18px 16px 4px; max-width: 640px; margin: -14px auto 0; }
  /* Globalnie, nie samo section[hidden]: kazda klasa, ktora ustawia wlasny
     display, bije domyslne [hidden] przegladarki - style autora wygrywaja ze
     stylami UA niezaleznie od specyficznosci. Element z atrybutem hidden
     zostawal wiec na ekranie, co wygladalo jak blad logiki, a bylo kaskada. */
  [hidden] { display: none !important; }
  .card {
    background: var(--card); border: 1px solid rgba(18,34,56,.05); border-radius: 20px; padding: 18px;
    box-shadow: 0 8px 26px rgba(24,48,79,.07); margin-bottom: 14px;
  }
  /* Wyśrodkowanie siedzi na nagłówku, nie na całej karcie: pod nagłówkiem
     karty meczu leżą teraz gole, a te są listą i czytają się od lewej. */
  .match-hero { overflow: hidden; padding: 0; }
  .hero-top { padding: 18px 18px 16px; background: linear-gradient(135deg, #073b78, #0059ad); color: #fff; text-align: center; }
  .hero-top .tag { color: rgba(255,255,255,.76); }
  .next .opponent { font-size: 24px; line-height: 1.15; font-weight: 800; letter-spacing: -.55px; margin: 8px auto 5px; max-width: 290px; }
  .next .when { color: rgba(255,255,255,.82); font-size: 13px; }
  .countdown {
    display: flex; justify-content: center; gap: 8px; padding: 14px 12px 17px;
  }
  .countdown div {
    background: #f2f6fb; color: var(--blue-dark); border-radius: 12px;
    min-width: 68px; padding: 8px 5px; border: 1px solid #e4edf6;
    text-align: center;
  }
  .countdown b { display: block; font-size: 24px; line-height: 1.1; }
  .countdown span { font-size: 10px; color: var(--muted); font-weight: 650; text-transform: uppercase; }
  .tag {
    display: inline-block; font-size: 10px; letter-spacing: .7px;
    text-transform: uppercase; color: var(--muted); font-weight: 750;
  }
  .section-heading { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px 10px; }
  .section-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.2px; }
  .section-heading span { color: var(--muted); font-size: 12px; }
  /* Kazdy mecz osobnym kafelkiem. W jednej karcie kreski musialy udawac
     granice miedzy meczami, a nazwy druzyn lamaly sie na dwie linie obok
     daty i wyniku wciśniętych w ten sam wiersz. Kafelek ma trzy wiersze,
     kazdy o czym innym, i nic sie nie bije o szerokosc. */
  .match-card { padding: 13px 15px; cursor: pointer; }
  .match-card:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .mc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .mc-teams { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 14.5px; line-height: 1.3; }
  .mc-teams > span:first-child { flex: 1; min-width: 0; }
  .mc-teams em { font-style: normal; font-weight: 700; }
  .mc-goals {
    margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--muted); line-height: 1.45;
  }
  .score {
    min-width: 46px; padding: 4px 8px; border-radius: 8px; text-align: center;
    background: #eef4fa; color: var(--blue-dark); font-weight: 800;
    font-variant-numeric: tabular-nums; flex: 0 0 auto;
  }
  .score.win { background: #e9f6ef; color: var(--success); }
  .score.loss { background: #fbeef0; color: #a72c3d; }
  .score.pending { color: var(--muted); font-weight: 500; }
  @media (prefers-reduced-motion: no-preference) {
    .match-card { transition: transform .12s ease, box-shadow .12s ease; }
    .match-card:active { transform: scale(.985); box-shadow: 0 3px 12px rgba(24,48,79,.09); }
  }
  .stat-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat-summary div { padding: 12px 8px; background: #fff; border: 1px solid #e4ebf2; box-shadow: 0 5px 14px rgba(24,48,79,.05); border-radius: 14px; text-align: center; }
  .stat-summary b { display: block; color: var(--blue); font-size: 21px; line-height: 1.1; }
  .stat-summary span { color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .table-card { padding: 14px 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase;
    letter-spacing: .45px; color: var(--muted); font-weight: 750;
    padding: 0 5px 9px; border-bottom: 1px solid var(--line);
  }
  td { padding: 10px 5px; border-bottom: 1px solid var(--line); }
  td.num, th.num {
    text-align: right; font-variant-numeric: tabular-nums;
    width: 1%; white-space: nowrap; padding-left: 8px;
  }
  /* max-width:0 with width:100% lets the name column take whatever is left and
     truncate, instead of pushing the numbers off a 375px screen. */
  td.name, th.name {
    max-width: 0; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  tr.us td { background: #fff6d6; font-weight: 750; }
  tr.us td:first-child { color: var(--blue); border-radius: 8px 0 0 8px; }
  tr.us td:last-child { border-radius: 0 8px 8px 0; }
  tbody tr:last-child td { border-bottom: 0; }
  .empty { color: var(--muted); text-align: center; padding: 26px 0; }
  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    padding: 10px 16px 18px;
  }
  button.push {
    display: block; width: 100%; margin-top: 8px; padding: 12px;
    border: 0; border-radius: 11px; background: var(--blue); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button.push[disabled] { background: var(--line); color: var(--muted); }
  .match[role="button"] { cursor: pointer; }
  .chevron { color: var(--muted); font-size: 20px; line-height: 1; flex: 0 0 auto; }
  button.back {
    background: none; border: 0; color: var(--blue); font: inherit;
    font-weight: 650; padding: 4px 2px 10px; cursor: pointer;
  }
  .scoreline { font-size: 17px; font-weight: 700; margin: 8px 0 4px; line-height: 1.3; }
  /* nowrap, bo przy dwoch dlugich nazwach wiersz lamal sie w srodku wyniku
     i "1-6" zostawalo rozbite na dwie linie. */
  .scoreline b { font-size: 21px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* Gole siedzą w karcie wyniku, bo to one ten wynik tłumaczą. */
  .goals-block { padding: 4px 16px 12px; }
  .goals-block .tag { display: block; margin: 12px 0 2px; }
  .goal { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 14px; }
  .goal + .goal { border-top: 1px solid var(--line); }
  .goal .min {
    width: 34px; flex: 0 0 auto; color: var(--muted);
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .goal .ball { width: 20px; flex: 0 0 auto; font-size: 14px; line-height: 1; }
  .goal .who { flex: 1; min-width: 0; font-weight: 650; }
  .goal .who .og {
    font-weight: 600; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .4px; margin-left: 5px;
  }
  /* Rywal czytelny, ale cofnięty: to jest aplikacja Dynovii. */
  .goal.theirs .who { font-weight: 500; color: var(--muted); }
  .goal .run {
    flex: 0 0 auto; min-width: 42px; text-align: center;
    padding: 3px 7px; border-radius: 7px; font-size: 12.5px; font-weight: 800;
    font-variant-numeric: tabular-nums; background: #eef4fa; color: var(--blue-dark);
  }
  .goal.theirs .run { background: #f2f4f7; color: var(--muted); }

  .cards-list { padding: 6px 16px; }
  .row { display: flex; align-items: center; gap: 11px; padding: 10px 0; font-size: 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row .min {
    width: 34px; flex: 0 0 auto; color: var(--muted);
    font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .row .who { flex: 1; min-width: 0; }
  .row.theirs .who { color: var(--muted); }
  .row .team {
    flex: 0 0 auto; font-size: 10px; letter-spacing: .4px; text-transform: uppercase;
    font-weight: 750; color: var(--muted); background: var(--bg);
    padding: 3px 7px; border-radius: 6px;
  }
  /* Kartka rysowana, nie 🟨: emoji ma inny rozmiar i odcień na każdym
     systemie, a kartka to dosłownie kolorowy prostokąt. */
  .chip-card {
    width: 13px; height: 17px; border-radius: 2.5px; flex: 0 0 auto;
    box-shadow: 0 1px 2px rgba(18,34,56,.22);
  }
  .chip-card.y { background: var(--yellow); }
  .chip-card.r { background: var(--red); }
  .chip-card.yr { background: linear-gradient(135deg, var(--yellow) 0 48%, var(--red) 52% 100%); }

  .subs { padding: 4px 16px 14px; }
  .subs h3 { font-size: 14px; margin: 14px 0 8px; }
  .subs h3:first-child { margin-top: 6px; }
  /* Jedna sekwencja to jedna minuta, nie jeden zawodnik: protokół zapisuje,
     kto zszedł i kto wszedł, ale nigdy kto kogo zmienił. */
  .seq { display: flex; gap: 11px; align-items: flex-start; background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .seq + .seq { margin-top: 7px; }
  .seq .min {
    flex: 0 0 auto; width: 30px; padding-top: 2px;
    color: var(--blue-dark); font-size: 12px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .seq .pair { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .swap { display: flex; align-items: center; gap: 8px; font-size: 13.5px; line-height: 1.3; }
  .swap .name { min-width: 0; }
  .swap.out .name { color: var(--muted); }
  .swap.in .name { font-weight: 650; }
  .subs.theirs .swap.in .name { font-weight: 500; color: var(--muted); }
  .arrow {
    flex: 0 0 auto; width: 15px; height: 15px; border-radius: 4px;
    display: grid; place-items: center; font-size: 9px; font-weight: 900; color: #fff;
  }
  .arrow.out { background: var(--off); }
  .arrow.in { background: var(--on); color: var(--on-ink); }
  .squads { padding: 4px 16px 14px; }
  .squad h3 { font-size: 14px; margin: 14px 0 6px; }
  .squad ul { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .squad li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .squad li:last-child { border-bottom: 0; }
  .squad .min { color: var(--muted); font-size: 11px; }
  .squad .tag { display: block; margin-top: 10px; }
  /* Przyklejony pod paskiem systemowym, a nie wpięty tylko na gorze strony:
     powiadomienie ma trafic do kogos, kto przeglada wyniki w polowie listy,
     a nie czekac az przewinie na sam gora. */
  .update-banner {
    position: sticky; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + 8px);
    display: flex; align-items: center; gap: 10px; justify-content: space-between;
    margin: 10px 14px -4px; padding: 10px 10px 10px 14px;
    background: var(--gold); color: var(--blue-dark);
    border-radius: 14px; box-shadow: 0 6px 18px rgba(18, 34, 56, .2);
    font-size: 13.5px; font-weight: 650;
    animation: drop-in .3s cubic-bezier(.2, .9, .3, 1.15);
  }
  @keyframes drop-in {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: none; }
  }
  .update-banner button {
    flex: 0 0 auto; border: 0; border-radius: 9px; padding: 8px 14px;
    background: var(--blue-dark); color: #fff;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .update-banner button:focus-visible { outline: 2px solid var(--blue-dark); outline-offset: 2px; }
  .update-banner button[disabled] { opacity: .6; }
  @media (prefers-reduced-motion: reduce) { .update-banner { animation: none; } }

  .done { color: var(--success); font-weight: 650; }
  .warn {
    display: inline-block; font-size: 10px; letter-spacing: .3px; font-weight: 750;
    text-transform: uppercase; color: #a72c3d; background: #fbeef0;
    padding: 2px 6px; border-radius: 6px; vertical-align: 1px;
  }
  .warn.blip { background: none; padding: 0; }
  .ver { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .ver b { color: var(--ink); }
  #refreshOut { color: var(--muted); font-size: 12px; text-align: center; padding-top: 8px; }
  .help p { margin: 8px 0; }
  .help ol { margin: 8px 0; padding-left: 20px; }
  .help li { margin-bottom: 6px; }
  pre.sub {
    white-space: pre-wrap; word-break: break-all; font-size: 11px;
    background: var(--bg); padding: 10px; border-radius: 9px; margin-top: 10px;
  }
  @media (min-width: 641px) {
    body { background: #eef3f8; }
    .app-shell { min-height: 100vh; background: var(--bg); box-shadow: 0 0 40px rgba(18,34,56,.09); }
    nav { left: 50%; right: auto; width: 640px; transform: translateX(-50%); }
  }
</style>
</head>
<body>
<div class="app-shell">
<header>
  <img src="icons/icon-192.png" alt="">
  <div>
    <h1>Dynovia Dynów</h1>
    <p id="season">—</p>
  </div>
</header>

<div class="update-banner" id="updateBanner" hidden>
  <span id="updateBannerText">Jest nowa wersja aplikacji</span>
  <button type="button" id="bannerRefresh">Odśwież</button>
</div>

<nav id="tabs">
  <button data-tab="next" aria-current="true">Najbliższy</button>
  <button data-tab="results">Wyniki</button>
  <button data-tab="stats">Statystyki</button>
  <button data-tab="table">Tabela</button>
  <button data-tab="sources">Źródła</button>
</nav>

<main>
  <section id="next"></section>
  <section id="results" hidden></section>
  <section id="stats" hidden></section>
  <section id="table" hidden></section>
  <section id="sources" hidden></section>
</main>

<footer id="updated"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
