<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynovia Alerts</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#004B96">
<style>
  /* Klubowe kolory odczytane wprost z herbu. */
  :root {
    --blue: #004B96;
    --blue-dark: #002f61;
    --gold: #FFC801;
    --ink: #122238;
    --muted: #60718a;
    --line: #e3e9f0;
    --bg: #f3f6fa;
    --card: #ffffff;
    --success: #137353;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #eaf1f8 0, var(--bg) 310px);
    color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(82px + env(safe-area-inset-bottom));
  }
  .app-shell { max-width: 640px; margin: 0 auto; }
  header {
    background: linear-gradient(135deg, var(--blue-dark), var(--blue));
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 16px) 20px 28px;
    display: flex; align-items: center; gap: 12px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 8px 20px rgba(0, 57, 117, .18);
  }
  header img { width: 46px; height: 46px; border-radius: 13px; background: #fff; padding: 2px; box-shadow: 0 3px 10px rgba(0,0,0,.16); }
  header h1 { font-size: 19px; margin: 0; font-weight: 750; letter-spacing: -.25px; }
  header p { margin: 1px 0 0; font-size: 12px; opacity: .78; }
  nav {
    position: fixed; z-index: 10; bottom: 0; left: 0; right: 0;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
    background: rgba(255,255,255,.96); backdrop-filter: blur(16px);
    padding: 7px max(12px, env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    border-top: 1px solid rgba(18,34,56,.1); box-shadow: 0 -8px 24px rgba(18,34,56,.08);
  }
  nav button {
    position: relative; background: none; border: 0; color: var(--muted);
    font: inherit; font-size: 10px; font-weight: 650; padding: 7px 2px 6px; cursor: pointer;
  }
  nav button::before { display: block; font-size: 18px; line-height: 1.1; margin-bottom: 3px; }
  nav button[data-tab="next"]::before { content: "⚽"; }
  nav button[data-tab="results"]::before { content: "✓"; }
  nav button[data-tab="stats"]::before { content: "▥"; }
  nav button[data-tab="table"]::before { content: "♜"; }
  nav button[data-tab="sources"]::before { content: "•••"; letter-spacing: 1px; }
  nav button[aria-current="true"] { color: var(--blue); }
  nav button[aria-current="true"]::after { content: ""; position: absolute; top: 0; left: 50%; width: 20px; height: 3px; transform: translateX(-50%); border-radius: 2px; background: var(--gold); }
  main { padding: 18px 16px 4px; max-width: 640px; margin: -14px auto 0; }
  section[hidden] { display: none; }
  .card {
    background: var(--card); border: 1px solid rgba(18,34,56,.05); border-radius: 20px; padding: 18px;
    box-shadow: 0 8px 26px rgba(24,48,79,.07); margin-bottom: 14px;
  }
  .match-hero { overflow: hidden; padding: 0; text-align: center; }
  .hero-top { padding: 18px 18px 16px; background: linear-gradient(135deg, #073b78, #0059ad); color: #fff; }
  .hero-top .tag { color: rgba(255,255,255,.76); }
  .next .opponent { font-size: 24px; line-height: 1.15; font-weight: 800; letter-spacing: -.55px; margin: 8px auto 5px; max-width: 290px; }
  .next .when { color: rgba(255,255,255,.82); font-size: 13px; }
  .countdown {
    display: flex; justify-content: center; gap: 8px; padding: 14px 12px 17px;
  }
  .countdown div {
    background: #f2f6fb; color: var(--blue-dark); border-radius: 12px;
    min-width: 68px; padding: 8px 5px; border: 1px solid #e4edf6;
  }
  .countdown b { display: block; font-size: 24px; line-height: 1.1; }
  .countdown span { font-size: 10px; color: var(--muted); font-weight: 650; text-transform: uppercase; }
  .tag {
    display: inline-block; font-size: 10px; letter-spacing: .7px;
    text-transform: uppercase; color: var(--muted); font-weight: 750;
  }
  .section-heading { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px 10px; }
  .section-heading h2 { margin: 0; font-size: 17px; letter-spacing: -.2px; }
  .section-heading span { color: var(--muted); font-size: 12px; }
  .results-card { padding: 8px 16px; }
  .match { display: flex; align-items: center; gap: 9px; padding: 12px 0 8px; }
  .match + .match, .goals + .match { border-top: 1px solid var(--line); }
  .match .date { width: 40px; font-size: 11px; color: var(--muted); font-weight: 700; flex: 0 0 auto; }
  .match .teams { flex: 1; min-width: 0; font-size: 13px; line-height: 1.25; }
  .match .teams em { font-style: normal; font-weight: 650; }
  .match .score {
    min-width: 43px; padding: 4px 6px; border-radius: 8px; text-align: center;
    background: #eef4fa; color: var(--blue-dark); font-weight: 800; font-variant-numeric: tabular-nums; flex: 0 0 auto;
  }
  .match .score.win { background: #e9f6ef; color: var(--success); }
  .match .score.loss { background: #fbeef0; color: #a72c3d; }
  .match .score.pending { color: var(--muted); font-weight: 500; }
  .goals { font-size: 11px; color: var(--muted); padding: 0 0 11px 49px; line-height: 1.4; }
  .stat-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat-summary div { padding: 12px 8px; background: #fff; border: 1px solid #e4ebf2; box-shadow: 0 5px 14px rgba(24,48,79,.05); border-radius: 14px; text-align: center; }
  .stat-summary b { display: block; color: var(--blue); font-size: 21px; line-height: 1.1; }
  .stat-summary span { color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .table-card { padding: 14px 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; text-transform: uppercase;
    letter-spacing: .45px; color: var(--muted); font-weight: 750;
    padding: 0 5px 9px; border-bottom: 1px solid var(--line);
  }
  td { padding: 10px 5px; border-bottom: 1px solid var(--line); }
  td.num, th.num {
    text-align: right; font-variant-numeric: tabular-nums;
    width: 1%; white-space: nowrap; padding-left: 8px;
  }
  /* max-width:0 with width:100% lets the name column take whatever is left and
     truncate, instead of pushing the numbers off a 375px screen. */
  td.name, th.name {
    max-width: 0; width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  tr.us td { background: #fff6d6; font-weight: 750; }
  tr.us td:first-child { color: var(--blue); border-radius: 8px 0 0 8px; }
  tr.us td:last-child { border-radius: 0 8px 8px 0; }
  tbody tr:last-child td { border-bottom: 0; }
  .empty { color: var(--muted); text-align: center; padding: 26px 0; }
  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    padding: 10px 16px 18px;
  }
  button.push {
    display: block; width: 100%; margin-top: 8px; padding: 12px;
    border: 0; border-radius: 11px; background: var(--blue); color: #fff;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button.push[disabled] { background: var(--line); color: var(--muted); }
  .help p { margin: 8px 0; }
  .help ol { margin: 8px 0; padding-left: 20px; }
  .help li { margin-bottom: 6px; }
  pre.sub {
    white-space: pre-wrap; word-break: break-all; font-size: 11px;
    background: var(--bg); padding: 10px; border-radius: 9px; margin-top: 10px;
  }
  @media (min-width: 641px) {
    body { background: #eef3f8; }
    .app-shell { min-height: 100vh; background: var(--bg); box-shadow: 0 0 40px rgba(18,34,56,.09); }
    nav { left: 50%; right: auto; width: 640px; transform: translateX(-50%); }
  }
</style>
</head>
<body>
<div class="app-shell">
<header>
  <img src="icons/icon-192.png" alt="">
  <div>
    <h1>Dynovia Dynów</h1>
    <p id="season">—</p>
  </div>
</header>

<nav id="tabs">
  <button data-tab="next" aria-current="true">Najbliższy</button>
  <button data-tab="results">Wyniki</button>
  <button data-tab="stats">Statystyki</button>
  <button data-tab="table">Tabela</button>
  <button data-tab="sources">Źródła</button>
</nav>

<main>
  <section id="next"></section>
  <section id="results" hidden></section>
  <section id="stats" hidden></section>
  <section id="table" hidden></section>
  <section id="sources" hidden></section>
</main>

<footer id="updated"></footer>
</div>
<script src="app.js"></script>
</body>
</html>
